name: Sync diary-app to ai-dialy

on:
  push:
    branches:
      - claude/ai-diary-cross-device-g1jsxt
    paths:
      - 'diary-app/**'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout machinekit
        uses: actions/checkout@v4

      - name: Sync to ai-dialy
        env:
          GH_PAT: ${{ secrets.DIARY_PAT }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          git clone https://sakairiyoshimasa:$GH_PAT@github.com/sakairiyoshimasa/ai-dialy.git /tmp/ai-dialy

          rsync -av --delete --exclude='.git' --exclude='node_modules' diary-app/ /tmp/ai-dialy/

          cd /tmp/ai-dialy
          git add .
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "Sync from machinekit"
          git push
